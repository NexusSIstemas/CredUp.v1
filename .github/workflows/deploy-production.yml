name: Publicar CredUp na VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: producao
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publicar:
    name: Publicar em produção
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      HOST: 70.38.101.135
      PORTA: "22"
      USUARIO: root
      DIRETORIO: /opt/credup

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar acesso SSH
        env:
          CHAVE_SSH: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$CHAVE_SSH" ]; then
            echo "::error::Cadastre VPS_SSH_PRIVATE_KEY nos segredos do ambiente production."
            exit 1
          fi

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$CHAVE_SSH" > "$HOME/.ssh/credup_deploy"
          chmod 600 "$HOME/.ssh/credup_deploy"
          ssh-keygen -y -f "$HOME/.ssh/credup_deploy" >/dev/null
          printf '%s\n' \
            '70.38.101.135 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIO1dPDEoCC3GuCuNta9PWpGNxoUTXIvxsma/fpGQFJx' \
            > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Validar diretório da VPS
        run: |
          case "$DIRETORIO" in
            /opt/*|/srv/*) ;;
            *)
              echo "VPS_DEPLOY_PATH deve estar dentro de /opt ou /srv."
              exit 1
              ;;
          esac

      - name: Gerar backup antes da publicação
        run: |
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -i "$HOME/.ssh/credup_deploy" \
            -p "$PORTA" \
            "$USUARIO@$HOST" \
            "cd '$DIRETORIO' && ./scripts/backup-postgres.sh"

      - name: Enviar arquivos para a VPS
        run: |
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -i "$HOME/.ssh/credup_deploy" \
            -p "$PORTA" \
            "$USUARIO@$HOST" \
            "mkdir -p '$DIRETORIO'"

          rsync \
            --archive \
            --compress \
            --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='.env.production' \
            --exclude='backups/' \
            --exclude='backup.log' \
            --exclude='node_modules/' \
            --exclude='target/' \
            --exclude='dist/' \
            -e "ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -i $HOME/.ssh/credup_deploy -p $PORTA" \
            ./ \
            "$USUARIO@$HOST:$DIRETORIO/"

      - name: Executar publicação
        run: |
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -i "$HOME/.ssh/credup_deploy" \
            -p "$PORTA" \
            "$USUARIO@$HOST" \
            "cd '$DIRETORIO' && chmod +x scripts/*.sh && ./scripts/deploy-production.sh"

      - name: Verificar aplicação
        run: |
          for tentativa in $(seq 1 20); do
            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 10 \
              "https://nexus.vps10413.panel.icontainer.cloud/health"
            then
              echo "CredUp publicado com sucesso."
              exit 0
            fi

            echo "Aguardando a aplicação iniciar ($tentativa/20)..."
            sleep 10
          done

          echo "A aplicação não respondeu dentro do tempo esperado."
          exit 1

      - name: Remover credencial temporária
        if: always()
        run: |
          rm -f "$HOME/.ssh/credup_deploy"
