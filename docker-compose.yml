services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: credup
      POSTGRES_USER: credup
      POSTGRES_PASSWORD: credup
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credup -d credup"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/credup
      DATABASE_USER: credup
      DATABASE_PASSWORD: credup
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-production-123}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-15}
      JWT_REFRESH_EXPIRATION_HOURS: ${JWT_REFRESH_EXPIRATION_HOURS:-8}
      JWT_REFRESH_COOKIE_SECURE: "false"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@credup.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-now}
      MERCADO_PAGO_AMBIENTE: ${MERCADO_PAGO_AMBIENTE:-sandbox}
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN:-}
      MERCADO_PAGO_API_URL: ${MERCADO_PAGO_API_URL:-https://api.mercadopago.com}
      MERCADO_PAGO_WEBHOOK_SECRET: ${MERCADO_PAGO_WEBHOOK_SECRET:-}
      CORS_ALLOWED_ORIGIN: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/api
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
