spring:
  application:
    name: credup
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/credup}
    username: ${DATABASE_USER:credup}
    password: ${DATABASE_PASSWORD:credup}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-with-at-least-32-bytes}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  pix:
    bb:
      ambiente: ${BB_PIX_AMBIENTE:sandbox}
      app-key: ${BB_PIX_APP_KEY:}
      client-id: ${BB_PIX_CLIENT_ID:}
      client-secret: ${BB_PIX_CLIENT_SECRET:}
      chave: ${BB_PIX_CHAVE:}
      valor-mensal: ${PIX_VALOR_MENSAL:99.90}
      expiracao-segundos: ${BB_PIX_EXPIRACAO_SEGUNDOS:3600}
