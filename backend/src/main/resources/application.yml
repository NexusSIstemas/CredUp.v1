spring:
  application:
    name: credup
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/credup}
    username: ${DATABASE_USER:credup}
    password: ${DATABASE_PASSWORD:credup}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-with-at-least-32-bytes}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  pix:
    mercado-pago:
      ambiente: ${MERCADO_PAGO_AMBIENTE:sandbox}
      access-token: ${MERCADO_PAGO_ACCESS_TOKEN:}
      valor-mensal: ${PIX_VALOR_MENSAL:39.90}
      expiracao-segundos: ${MERCADO_PAGO_PIX_EXPIRACAO_SEGUNDOS:3600}
      api-url: ${MERCADO_PAGO_API_URL:https://api.mercadopago.com}
      webhook-secret: ${MERCADO_PAGO_WEBHOOK_SECRET:}
